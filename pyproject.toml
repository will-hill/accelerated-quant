[project]
name = "accelerated-quant"
version = "0.0.1"
description = "GPU and AI accelerated quant finance engine for the Accelerated Options and Accelerated Portfolios books"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Will Hill" }]
dependencies = ["numpy>=1.26", "pandas>=2.2"]
classifiers = ["Development Status :: 1 - Planning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


